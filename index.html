<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Te amo ❤️</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #3b0a2e, #120014 70%);
            font-family: 'Segoe UI', sans-serif;
        }

        .contenedor {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .te-amo {
            font-size: clamp(4rem, 12vw, 10rem);
            font-weight: 800;
            color: #fff;
            text-shadow:
                0 0 10px #ff4d8d,
                0 0 25px #ff4d8d,
                0 0 50px #ff0066,
                0 0 90px #ff0066;

            animation:
                aparecer 2s ease-out,
                latido 1.8s ease-in-out 2s infinite;
        }

        .corazon-central {
            display: inline-block;
            color: #ff1744;
            animation: latidoCorazon 1s infinite;
        }

        .subtexto {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            letter-spacing: 4px;
            animation: aparecer 3s ease-out;
        }

        /* Corazones flotantes */

        .corazones {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .corazon {
            position: absolute;
            bottom: -50px;
            color: #ff4d8d;
            font-size: 25px;
            opacity: 0;
            animation: flotar linear infinite;
            filter: drop-shadow(0 0 8px #ff0066);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.2) translateY(50px);
                filter: blur(15px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes latidoCorazon {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.25);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.2);
            }
        }

        @keyframes flotar {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.7);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg)
                    scale(1.3);
                opacity: 0;
            }
        }

        /* Brillo de fondo */

        .brillo {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: #ff0066;
            filter: blur(150px);
            opacity: 0.15;
            animation: moverBrillo 8s ease-in-out infinite alternate;
        }

        @keyframes moverBrillo {
            from {
                transform: translate(-200px, -100px);
            }

            to {
                transform: translate(200px, 100px);
            }
        }
    </style>
</head>

<body>

    <div class="brillo"></div>

    <div class="corazones" id="corazones"></div>

    <div class="contenedor container">

        <div class="te-amo">
            Te amo
            <span class="corazon-central">❤️</span>
        </div>

        <div class="subtexto">
            PARA SIEMPRE
        </div>

    </div>

    <script>

        const contenedor = document.getElementById("corazones");

        function crearCorazon() {

            const corazon = document.createElement("div");

            corazon.classList.add("corazon");

            const corazones = ["❤️", "💗", "💕", "💖", "💘"];

            corazon.innerHTML =
                corazones[Math.floor(Math.random() * corazones.length)];

            // Posición horizontal aleatoria
            corazon.style.left = Math.random() * 100 + "vw";

            // Tamaño aleatorio
            const tamaño = Math.random() * 25 + 15;
            corazon.style.fontSize = tamaño + "px";

            // Duración aleatoria
            const duracion = Math.random() * 5 + 5;
            corazon.style.animationDuration = duracion + "s";

            // Retraso aleatorio
            corazon.style.animationDelay =
                Math.random() * 2 + "s";

            contenedor.appendChild(corazon);

            // Eliminar después de la animación
            setTimeout(() => {
                corazon.remove();
            }, (duracion + 2) * 1000);
        }

        // Crear corazones continuamente
        setInterval(crearCorazon, 350);

        // Crear algunos inmediatamente
        for (let i = 0; i < 15; i++) {
            setTimeout(crearCorazon, i * 150);
        }

    </script>

</body>
</html>
